services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: bookgraph
      POSTGRES_USER: bookgraph
      POSTGRES_PASSWORD: bookgraph
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookgraph -d bookgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://bookgraph:bookgraph@db:5432/bookgraph
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: [.env]
    environment:
      MCP_URL: http://mcp:8001/mcp
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      - mcp
    ports:
      - "8000:8000"

volumes:
  pgdata:
