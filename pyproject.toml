[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "book-series-grapher"
version = "0.1.0"
description = "Temporal, spoiler-safe book-series character and interaction knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "fastmcp>=2.10,<3",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "pydantic>=2.12,<3",
  "pydantic-ai>=1,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/book_series_grapher"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the Docker PostgreSQL service"]
